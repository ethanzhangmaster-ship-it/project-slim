name: ASO Auto Optimization - Cloud Cron
#
# 与机器/账号/关机状态完全解耦的自动优化调度器.
#
# 触发时间 (UTC):
#   - 每天 01:00 UTC = 北京时间 09:00 (每日 ASO + 多渠道 + Dashboard)
#   - 每次 push / workflow_dispatch 也可手动触发调试
#
# 依赖 (必须在 GitHub repo Settings → Secrets and variables → Actions 设置):
#
#   STATE_STORE_BACKEND = gist                  # 或 s3
#   STATE_STORE_ROOT    = <你的 gist id>         # gist 后端: 空 secret gist 的 ID
#   GITHUB_TOKEN 或 GIST_TOKEN = <有 gist 权限的 PAT>  # https://github.com/settings/tokens
#
#   (可选, 接入真实 Play Console 数据)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 = base64(服务账号.json)
#
#   (可选, 接入 LLM 生成更激进变体)
#   OPENAI_API_KEY = sk-...
#   OPENAI_BASE_URL = https://...
#   OPENAI_MODEL = gpt-4.1-mini
#

on:
  schedule:
    - cron: '0 1 * * *'        # 每天 01:00 UTC = 09:00 BEIJING — 每日优化循环
    - cron: '0 */6 * * *'      # 每 6 小时 — 快速健康检查 + 断点续跑
  workflow_dispatch:           # 允许手动触发 (点 Run workflow 按钮调试)
    inputs:
      game_id:
        description: '单产品 GAME_ID (例: com.born2play.biblequiz). 留空=跑全量'
        required: false
        type: string
        default: ''
      force_new_variant:
        description: '强制生成新的 Listing 变体? (true/false)'
        required: false
        type: boolean
        default: false
      only_healthcheck:
        description: '只做 STATE_STORE 健康检查 (不跑任务)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read  # 只需要拉代码, 不需要 push

concurrency:
  group: aso-optimization
  cancel-in-progress: false

jobs:
  aso-optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # ── 可移植: 优先从 Secrets 读取, 不绑定任何机器 ──
      STATE_STORE_BACKEND: ${{ vars.STATE_STORE_BACKEND || 'local' }}
      STATE_STORE_ROOT:    ${{ secrets.STATE_STORE_ROOT || './data' }}
      GITHUB_TOKEN:        ${{ secrets.GIST_TOKEN || secrets.GITHUB_TOKEN }}
      GIST_TOKEN:          ${{ secrets.GIST_TOKEN }}

      # LLM
      AI_PROVIDER:     ${{ vars.AI_PROVIDER || 'mock' }}
      OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL:    ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}

      # Google Play (可选)
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}

      # 调度日志级别
      CLOUD_RUNNER_LOGLEVEL: INFO

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project (with boto3 for S3 backend)
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e . --no-build-isolation
          pip install boto3  # S3/R2 后端可选依赖

      - name: (If Gist backend) Probe STATE_STORE health first
        if: ${{ vars.STATE_STORE_BACKEND == 'gist' }}
        run: |
          python -m market_ops.workspace.cloud_runner --healthcheck --no-dotenv

      - name: (If S3 backend) Probe STATE_STORE health first
        if: ${{ vars.STATE_STORE_BACKEND == 's3' }}
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL:       ${{ vars.S3_ENDPOINT_URL }}
        run: |
          python -m market_ops.workspace.cloud_runner --healthcheck --no-dotenv

      - name: Decode Google Play Service Account (if provided)
        env:
          GP_SA_B64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        if: ${{ env.GP_SA_B64 != '' }}
        run: |
          mkdir -p ./data/secrets
          echo "$GP_SA_B64" | base64 -d > ./data/secrets/google_play_service_account.json
          echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=$(pwd)/data/secrets/google_play_service_account.json" >> "$GITHUB_ENV"

      - name: "Manual trigger — single game mode"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.game_id != '' && inputs.only_healthcheck != true }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_new_variant }}" = "true" ]; then
            FORCE_FLAG="--force-new-variant"
          fi
          python -m market_ops.workspace.cloud_runner \
            --no-dotenv --json \
            --game "${{ inputs.game_id }}" \
            --multichannel-plan "${{ inputs.game_id }}" \
            $FORCE_FLAG

      - name: "Scheduled daily — all games + dashboard"
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') || (github.event_name == 'workflow_dispatch' && inputs.game_id == '' && inputs.only_healthcheck != true) }}
        run: |
          python -m market_ops.workspace.cloud_runner \
            --no-dotenv --json \
            --all --dashboard

      - name: "Scheduled 6h — health + recovery only (轻量)"
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *' }}
        run: |
          # 仅做 healthcheck + startup recovery 自动执行 (隐含在 healthcheck 之前的 common 步骤)
          python -m market_ops.workspace.cloud_runner --no-dotenv --healthcheck

      - name: Upload run artifacts (调试 / 审计)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aso-run-${{ github.run_id }}
          path: |
            data/aso_deploy/**/*.json
            data/aso_deploy/**/*.md
            data/aso_deploy/**/*.jsonl
          if-no-files-found: ignore
          retention-days: 30
