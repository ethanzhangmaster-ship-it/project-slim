name: Production CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  production-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install production package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-build-isolation
          pip install pytest
      - name: Verify production contracts
        run: |
          python -m pytest \
            tests/test_config.py \
            tests/test_digest.py \
            tests/test_decision_engine.py \
            tests/test_closed_loop.py \
            tests/test_loop_cli.py \
            tests/test_evidence_adapter.py \
            tests/test_evidence_freshness.py \
            tests/test_campaign_binding.py \
            tests/test_platform_write_readiness.py \
            tests/test_meta_config_alias.py \
            tests/test_product_control_plane.py \
            tests/test_product_service.py \
            --tb=short -q -p no:warnings
