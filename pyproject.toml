[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-ops"
version = "0.1.0"
description = "Semi-automated Market Ops workflow for Feishu-based marketing teams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "google-ads>=25.1.0",
  "openai>=1.30.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
]

[project.scripts]
market-ops = "market_ops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
