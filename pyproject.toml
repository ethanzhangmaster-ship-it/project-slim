[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-ops"
version = "0.2.0"
description = "AI Creative Growth Operating System — autonomous ad creative evolution platform + AI Game Publishing OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "google-ads>=25.1.0",
  "openai>=1.30.0",
  "opencv-python-headless>=4.10.0",
  "python-dotenv>=1.0.1",
  "pycryptodome>=3.20.0",
  "redis>=5.0",
  "requests>=2.32.3",
  "sqlalchemy>=2.0",
  "jsonschema>=4.18",
  "pyyaml>=6.0",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
market-ops = "market_ops.cli:main"
market-ops-control = "market_ops.product.server:main"
market-ops-doctor = "market_ops.product.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "src*", "market_ops*",
  "security*", "observability*", "audit*", "backup*", "release_gate*",
  "monetization*", "operation*", "analytics*", "optimization*",
  "intelligence*", "simulation*", "events*", "health*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--tb=short -q --ignore=tests/test_new_modules.py --ignore=tests/_legacy --import-mode=importlib"
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "e2e: end-to-end tests",
  "security: security tests",
  "slow: slow tests",
]

[tool.coverage.run]
source = ["src", "security", "observability", "audit", "backup", "release_gate", "monetization", "operation"]
omit = ["tests/*", "*/test_*", "*/validate_*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = false
