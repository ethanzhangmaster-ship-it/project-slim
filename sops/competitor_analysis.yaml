# 竞品分析 SOP
# 适用场景: 对某款竞品做全方位分析 (数据表现 + UA 策略 + 变现策略 + 创意素材)
# 输入变量: $competitor_name $genre
name: competitor_analysis
trigger: manual
description: |
  竞品全景分析流程: 市场研究 → UA 策略分析 → 变现分析 → 创意策略 → 总结报告
steps:
  # 步骤 1: gpt-researcher 深度研究竞品
  - agent: MarketIntelligenceAgent
    action: research_market
    input:
      query: "${competitor_name} ${genre} game revenue downloads user acquisition strategy monetization model 2026"
      report_type: research_report
    output: competitor_research
    timeout: 180
    on_error: skip

  # 步骤 2: 市场情报管道抓取竞品创意信号
  - agent: MarketIntelligenceAgent
    action: mine_creative_signals
    input:
      game_ids:
        - "${competitor_name}"
      region: "GLOBAL"
    output: creative_signals
    timeout: 30
    on_error: skip

  # 步骤 3: 竞品热度/趋势分析
  - agent: MarketIntelligenceAgent
    action: detect_trends
    input:
      platforms:
        - GLOBAL
      lookback_days: 30
    output: trend_report
    timeout: 30
    on_error: skip

  # 步骤 4: 竞品追踪
  - agent: MarketIntelligenceAgent
    action: track_competitors
    input:
      competitor_ids:
        - "${competitor_name}"
      lookback_days: 60
    output: competitor_tracking
    timeout: 30
    on_error: skip

  # 步骤 5: 数据分析师汇总
  - agent: DataAnalystAgent
    action: compute_bi_report
    input:
      title: "Competitor Analysis Report - ${competitor_name}"
      competitor: "${competitor_name}"
      competitor_research: "$competitor_research"
      creative_signals: "$creative_signals"
      trend_report: "$trend_report"
      competitor_tracking: "$competitor_tracking"
    output: final_report
    timeout: 60
    on_error: skip

fallback_on_error: skip
metadata:
  owner: marketing
  criticality: medium
